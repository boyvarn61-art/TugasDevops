    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: #05060d;
      color: #e8eefc;
    }

    /* Lapisan background (tetap di tempat, tidak ikut scroll) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: var(--img) center top / cover no-repeat;
      filter: brightness(.8);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(3, 4, 10, 0) 40%, rgba(3, 4, 10, .55) 100%);
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      padding: clamp(1.25rem, 5vw, 2rem);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(3, 4, 10, .92) 0%, rgba(9, 22, 52, .92) 55%, rgba(16, 44, 110, .92) 100%);
      border: 1px solid rgba(91, 140, 255, .35);
      box-shadow: 0 14px 50px rgba(0, 0, 0, .6);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      animation: muncul .4s ease-out;
    }
    @keyframes muncul { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .badge {
      display: inline-block;
      margin-bottom: .75rem;
      padding: .2rem .65rem;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #9db9ff;
      border: 1px solid rgba(91, 140, 255, .45);
      border-radius: 999px;
    }
    h1 { margin: 0 0 1.5rem; font-size: clamp(1.35rem, 5vw, 1.7rem); line-height: 1.2; color: #fff; }
    .sub { margin: 0 0 1.5rem; color: #9fb3d9; font-size: .95rem; line-height: 1.45; }

    .field { margin-bottom: .9rem; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; font-size: .95rem; }
    input {
      width: 100%;
      min-height: 48px;
      padding: .7rem .9rem;
      font-size: 1rem;
      border: 1px solid #2c4a8a;
      border-radius: 10px;
      background: rgba(255, 255, 255, .07);
      color: #fff;
      transition: border-color .15s, background .15s;
    }
    input::placeholder { color: #7d93c0; }
    input:focus-visible { outline: 2px solid #5b8cff; outline-offset: 1px; background: rgba(255, 255, 255, .1); }
    input.invalid { border-color: #ff6b6b; }
    .error { display: block; min-height: 1.2rem; margin-top: .25rem; font-size: .85rem; color: #ff8585; }

    .actions { display: flex; gap: .6rem; margin-top: .25rem; }
    button {
      flex: 1;
      min-height: 48px;
      padding: .7rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.97); }
    button:focus-visible { outline: 2px solid #5b8cff; outline-offset: 2px; }
    #btn-proses { background: #2f6bff; color: #fff; border: 1px solid #2f6bff; }
    #btn-proses:hover { background: #4a80ff; }
    #btn-clear { background: transparent; color: #cfe0ff; border: 1px solid #2c4a8a; }
    #btn-clear:hover { background: rgba(255, 255, 255, .08); }

    #hasil {
      display: none;
      margin-top: 1.25rem;
      padding: .8rem 1rem;
      border: 1px solid #2c4a8a;
      border-radius: 10px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
      background: rgba(0, 0, 0, .3);
    }
    #hasil.boleh { border-color: #4ade80; color: #4ade80; }
    #hasil.tidak { border-color: #ff6b6b; color: #ff8585; }

    footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(91, 140, 255, .2);
      text-align: center;
      font-size: .85rem;
      color: #8ea3cc;
    }

    /* Laptop / layar lebar: gambar utuh di kiri, form di sisi kanan */
    @media (min-width: 900px) and (orientation: landscape) {
      body { padding: 2rem 2rem 2rem calc(56.2vh + 2rem); }
      body::before {
        background: var(--img) center / cover no-repeat;
        filter: blur(30px) brightness(.45);
        transform: scale(1.1);
      }
      body::after {
        inset: 0 auto 0 0;
        width: 56.2vh;
        background: var(--img) center / 100% 100% no-repeat;
        -webkit-mask-image: linear-gradient(to right, #000 82%, transparent);
        mask-image: linear-gradient(to right, #000 82%, transparent);
      }
      .wrap { max-width: 440px; }
    }

    /* HP layar kecil */
    @media (max-width: 380px) {
      body { padding: .75rem; }
      .actions { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Registrasi Pengunjung</h1>

    <form id="form-registrasi" novalidate>
      <div class="field">
        <label for="nama">Nama</label>
        <input type="text" id="nama" placeholder="Ketik nama" autocomplete="off">
        <span class="error" id="nama-error"></span>
      </div>
      <div class="field">
        <label for="usia">Usia</label>
        <input type="number" id="usia" placeholder="Ketik usia" min="0" max="120" inputmode="numeric">
        <span class="error" id="usia-error"></span>
      </div>
      <div class="actions">
        <button type="submit" id="btn-proses">Proses</button>
        <button type="button" id="btn-clear">Clear</button>
      </div>
    </form>

    <div id="hasil" role="status" aria-live="polite"></div>

    <footer>Ramadhan Saleh Siregar &middot; NPM 248160031</footer>
  </div>

  <script>
    $(document).ready(function () {
      var BATAS_USIA = 27;

      function resetError() {
        $('.error').text('');
        $('#nama, #usia').removeClass('invalid');
      }

      // Tombol PROSES (juga jalan saat tekan Enter)
      $('#form-registrasi').on('submit', function (e) {
        e.preventDefault();
        resetError();
        $('#hasil').hide();

        var nama = $('#nama').val().trim();
        var usiaText = $('#usia').val().trim();
        var usia = Number(usiaText);
        var valid = true;

        if (nama === '') {
          $('#nama').addClass('invalid');
          $('#nama-error').text('Nama harus diisi.');
          valid = false;
        }
        if (usiaText === '' || isNaN(usia) || usia < 0) {
          $('#usia').addClass('invalid');
          $('#usia-error').text('Usia harus diisi dengan angka yang valid.');
          valid = false;
        }
        if (!valid) {
          $(nama === '' ? '#nama' : '#usia').focus();
          return;
        }

        var boleh = usia >= BATAS_USIA;
        var pesan = 'HELLO, ' + nama.toUpperCase() + '\n' +
                    (boleh ? 'ANDA BOLEH MASUK' : 'ANDA TIDAK BOLEH MASUK');

        // Dialog ALERT sesuai permintaan client
        alert(pesan);

        // Ringkasan hasil di halaman
        $('#hasil')
          .removeClass('boleh tidak')
          .addClass(boleh ? 'boleh' : 'tidak')
          .text(pesan.replace('\n', ' - '))
          .show();
      });

      // Tombol CLEAR: hapus isi textfield nama & usia
      $('#btn-clear').on('click', function () {
        $('#nama, #usia').val('');
        resetError();
        $('#hasil').hide();
        $('#nama').focus();
      });
    });
  </script>
</body>
</html>
